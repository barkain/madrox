# Madrox Harness / Model Configuration
#
# Each top-level key is a harness (the `instance_type` used when spawning).
# Everything here is optional and hot-swappable — Madrox never validates model
# ids against an allowlist, because vendors ship new models constantly and the
# backends serving them change independently of Madrox. Any model string passed
# to spawn_claude / spawn_codex / spawn_grok is forwarded to the CLI as-is.
#
# Keys per harness:
#   default      Model used when the caller does not name one.
#                Set it to `null` (or delete it) to let the CLI pick its own.
#   command      Optional path/name of the executable (default: the harness binary).
#   extra_args   Optional list of flags appended to every launch of that harness.
#   known_models Informational only (docs/dashboards) — NOT enforced.
#
# Overrides without editing this file:
#   MADROX_MODELS_CONFIG=/path/to/models.yaml   use a different config entirely
#   MADROX_MODEL_CLAUDE=claude-opus-5           override one harness default
#   MADROX_CLAUDE_BIN=/usr/local/bin/claude     override one harness binary
#   (same pattern for CODEX / GROK, and for any harness added later)

# Claude Code CLI (Anthropic)
claude:
  # Latest Opus — most capable model, the default for new instances.
  default: claude-opus-5

  known_models:
    - claude-opus-5       # Default: latest Opus, most capable
    - claude-sonnet-5     # Balanced speed/quality for daily use
    - claude-haiku-4-5    # Fastest: best for simple, quick tasks
    - claude-opus-4-6     # Previous Opus generation

# Codex CLI (OpenAI GPT models)
codex:
  default: gpt-5.6-sol

  known_models:
    - gpt-5.6-sol         # Default
    - gpt-5.5
    - gpt-5.4
    - gpt-5.4-mini
    - gpt-5.3-codex

# Grok Build CLI (xAI)
grok:
  default: grok-build-0.1

  known_models:
    - grok-build-0.1      # Default: purpose-built coding model
    - grok-4.5
    - grok-4.3
